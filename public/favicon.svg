      <stop offset="0%" stop-color="#45f2b4"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45f2b4" stop-opacity="0.8"/>
